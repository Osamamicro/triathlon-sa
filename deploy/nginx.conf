# nginx server block for the production site.
#
# Install as /etc/nginx/sites-available/triathlon, symlink into sites-enabled, then:
#   sudo certbot --nginx -d triathlon.sa -d www.triathlon.sa
# which fills in the certificate paths marked below.
#
# Staging is a copy of this file with server_name staging.triathlon.sa, proxy_pass to port 5001,
# and its own certificate. The application's own Basic-auth gate protects it (Site__Staging=true),
# so nothing extra is needed here.

server {
    listen 80;
    listen [::]:80;
    server_name triathlon.sa www.triathlon.sa;

    # certbot keeps the ACME challenge location here and redirects everything else to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name triathlon.sa www.triathlon.sa;

    # Filled in by certbot.
    ssl_certificate     /etc/letsencrypt/live/triathlon.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/triathlon.sa/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Matches the media store's 25 MB limit, so an oversized upload is refused by the application
    # with a readable message rather than by nginx with a bare 413.
    client_max_body_size 25m;

    access_log /var/log/nginx/triathlon.access.log;
    error_log  /var/log/nginx/triathlon.error.log;

    # Uploaded media is served straight off the disk: it is immutable (every file is named by a
    # GUID), so it never needs to touch the application or its output cache.
    location /media/ {
        alias /var/lib/triathlon/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Site__BehindProxy=true tells the application to trust these two.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        # The dashboard is Blazor Server: without these the SignalR circuit cannot connect.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection_upgrade;
        proxy_read_timeout 100s;

        proxy_buffering off;
    }
}

# Required by the Connection header above; belongs in the http block of nginx.conf.
#
#   map $http_upgrade $http_connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # global.json pins the SDK, so the runner installs the same one the team builds with.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors (see Directory.Build.props), so this is also the lint step.
      - name: Build
        run: dotnet build -c Release --no-restore

      # The integration tests start a PostgreSQL container through Testcontainers; the Docker
      # daemon on the hosted Ubuntu runner is what makes that work without any extra setup.
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      - name: Publish
        run: dotnet publish src/Triathlon.Web -c Release -o publish

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: triathlon-web
          path: publish/
